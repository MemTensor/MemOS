name: MemOS Local Plugin (V2) — Legacy Standalone Publisher

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.2 or 2.0.2-beta.1)"
        required: true
      tag:
        description: "npm dist-tag (latest for production, beta/next/alpha for testing)"
        required: true
        type: choice
        options:
          - latest
          - beta
          - next
          - alpha
        default: "latest"
      git_ref:
        description: "Git ref to build package code from. Leave blank for normal releases; release automation always uses this workflow revision."
        required: false
        default: ""
      release_notes:
        description: "Optional Markdown notes. Stable latest releases must still pass evidence/source_refs quality checks."
        required: false
        default: ""
      dry_run:
        description: "Prepare package notes and build artifacts only. Skip npm publish, tag creation, and the independent local-plugin GitHub Release."
        required: true
        type: boolean
        default: true
      recover_existing_npm_release:
        description: "Allow reconstructing a missing tag for an existing npm version. Keep false for normal releases."
        required: true
        type: boolean
        default: false
      legacy_publish_confirmation:
        description: "Required only when dry_run=false. Must exactly equal: LEGACY PUBLISH memos-local-plugin-v<version>"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      git_ref:
        required: true
        type: string
      release_notes:
        required: false
        type: string
        default: ""
      dry_run:
        required: true
        type: boolean
      recover_existing_npm_release:
        required: false
        type: boolean
        default: false
      docs_sync_mode:
        required: true
        type: string
      memos_release_version:
        required: true
        type: string
      caller_publish_confirmation:
        required: false
        type: string
        default: ""
      create_draft_release:
        required: false
        type: boolean
        default: true
      memos_release_tag:
        required: false
        type: string
        default: ""
      publish_phase:
        required: false
        type: string
        default: "full"
      auto_post_merge_release:
        required: false
        type: boolean
        default: false
    outputs:
      local_plugin_tag:
        value: ${{ jobs.publish.outputs.local_plugin_tag }}
      local_plugin_tag_sha:
        value: ${{ jobs.publish.outputs.local_plugin_tag_sha }}
      package_source_sha:
        value: ${{ jobs.publish.outputs.package_source_sha }}
      local_plugin_release_url:
        value: ${{ jobs.publish.outputs.local_plugin_release_url }}
      local_plugin_release_is_draft:
        value: ${{ jobs.publish.outputs.local_plugin_release_is_draft }}
      local_plugin_evidence_digest:
        value: ${{ jobs.publish.outputs.local_plugin_evidence_digest }}
concurrency:
  group: memos-local-plugin-publish
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/memos-local-plugin

permissions:
  contents: read

jobs:
  guard-legacy-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_source_sha: ${{ steps.resolve-package-source.outputs.sha }}
    steps:
      - name: Validate release inputs and standalone publish confirmation
        shell: bash
        working-directory: .
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
          LEGACY_PUBLISH_CONFIRMATION: ${{ inputs.legacy_publish_confirmation }}
          DOCS_SYNC_MODE: ${{ inputs.docs_sync_mode }}
          MEMOS_RELEASE_VERSION: ${{ inputs.memos_release_version }}
          CALLER_PUBLISH_CONFIRMATION: ${{ inputs.caller_publish_confirmation }}
          MEMOS_RELEASE_TAG: ${{ inputs.memos_release_tag }}
          PUBLISH_PHASE: ${{ inputs.publish_phase || 'full' }}
          AUTO_POST_MERGE_RELEASE: ${{ inputs.auto_post_merge_release }}
        run: |
          set -euo pipefail
          node -e '
            const version = process.argv[1];
            const distTag = process.argv[2];
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(version);
            if (!match) throw new Error(`version must be valid SemVer without a leading v; received ${version}`);
            if (version.includes("+")) throw new Error(`SemVer build metadata is not supported for npm/tag publishing; received ${version}`);
            const prereleaseIdentifiers = (match[4] || "").split(".").filter(Boolean);
            if (prereleaseIdentifiers.some((part) => /^\d+$/.test(part) && part.length > 1 && part.startsWith("0"))) {
              throw new Error(`numeric prerelease identifiers must not contain leading zeroes; received ${version}`);
            }
            if (!["latest", "beta", "next", "alpha"].includes(distTag)) {
              throw new Error(`unsupported npm dist-tag ${distTag}`);
            }
            const channel = (match[4] || "").split(".")[0];
            if (!channel && distTag !== "latest") throw new Error(`stable version ${version} must use latest`);
            if (channel && distTag === "latest") throw new Error(`prerelease version ${version} must not use latest`);
            if (["beta", "alpha", "next"].includes(channel) && channel !== distTag) {
              throw new Error(`prerelease channel ${channel} must use npm dist-tag ${channel}`);
            }
            if (channel && !["beta", "alpha", "next"].includes(channel) && distTag !== "next") {
              throw new Error(`prerelease channel ${channel} must use npm dist-tag next`);
            }
          ' "${RELEASE_VERSION}" "${NPM_DIST_TAG}"

          case "${PUBLISH_PHASE}" in
            full|stage_release|publish_npm_only) ;;
            *)
              echo "::error::publish_phase must be full, stage_release, or publish_npm_only; received ${PUBLISH_PHASE}."
              exit 1
              ;;
          esac
          if [ "${PUBLISH_PHASE}" != "full" ] && [ "${DOCS_SYNC_MODE}" != "paired_with_memos_release" ]; then
            echo "::error::publish_phase=${PUBLISH_PHASE} is only valid for paired MemOS weekly releases."
            exit 1
          fi
          if [ "${PUBLISH_PHASE}" = "publish_npm_only" ] && [ "${DRY_RUN}" = "true" ]; then
            echo "::error::publish_phase=publish_npm_only requires dry_run=false."
            exit 1
          fi

          if [ -n "${DOCS_SYNC_MODE}" ]; then
            if [ "${DOCS_SYNC_MODE}" != "paired_with_memos_release" ]; then
              echo "::error::Reusable local-plugin publishing only accepts docs_sync_mode=paired_with_memos_release."
              exit 1
            fi
            if ! [[ "${MEMOS_RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::memos_release_version is invalid: ${MEMOS_RELEASE_VERSION:-<empty>}"
              exit 1
            fi
            if [ "${MEMOS_RELEASE_TAG}" != "v${MEMOS_RELEASE_VERSION}" ]; then
              echo "::error::memos_release_tag must exactly equal v${MEMOS_RELEASE_VERSION}."
              exit 1
            fi
            if [ "${DRY_RUN}" != "true" ] && [ "${AUTO_POST_MERGE_RELEASE}" != "true" ]; then
              expected="PUBLISH v${MEMOS_RELEASE_VERSION} WITH LOCAL PLUGIN v${RELEASE_VERSION}"
              if [ "${CALLER_PUBLISH_CONFIRMATION}" != "${expected}" ]; then
                echo "::error::The calling MemOS release confirmation must exactly equal: ${expected}"
                exit 1
              fi
            fi
            echo "Validated MemOS weekly-release caller; the local-plugin Release will be paired with ${MEMOS_RELEASE_TAG}."
          elif [ -n "${DOCS_SYNC_MODE}" ] || [ -n "${MEMOS_RELEASE_VERSION}" ] || [ -n "${CALLER_PUBLISH_CONFIRMATION}" ]; then
            echo "::error::Internal reusable-workflow inputs are not accepted from workflow_dispatch."
            exit 1
          elif [ "${DRY_RUN}" = "true" ]; then
            echo "dry_run=true; legacy standalone publish confirmation is not required."
          else
            expected="LEGACY PUBLISH memos-local-plugin-v${RELEASE_VERSION}"
            if [ "${LEGACY_PUBLISH_CONFIRMATION}" != "${expected}" ]; then
              echo "::error::This workflow is the standalone local-plugin npm publisher for beta or latest package releases."
              echo "::error::MemOS Release — Publish remains the weekly whole-repo release path and can also update the Plugin tab from apps/memos-local-plugin/** changes."
              echo "::error::To intentionally run this legacy publisher, set legacy_publish_confirmation exactly to: ${expected}"
              exit 1
            fi
          fi

      - name: Resolve package source once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin and validate package source
        id: resolve-package-source
        shell: bash
        working-directory: .
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PUBLISH_PHASE: ${{ inputs.publish_phase || 'full' }}
          MEMOS_RELEASE_TAG: ${{ inputs.memos_release_tag }}
        run: |
          set -euo pipefail
          package_source_sha="$(git rev-parse HEAD)"
          test -f apps/memos-local-plugin/package.json
          echo "sha=${package_source_sha}" >> "${GITHUB_OUTPUT}"
          echo "Package source SHA: ${package_source_sha}"
          echo "Release automation SHA: ${WORKFLOW_SHA}"

          if [ "${DRY_RUN}" = "true" ]; then
            exit 0
          fi

          git fetch --no-tags origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
            "${WORKFLOW_SHA}"
          default_branch_sha="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          if [ "${WORKFLOW_SHA}" != "${default_branch_sha}" ]; then
            echo "::error::Formal publishing must use the latest release automation from ${DEFAULT_BRANCH} (${default_branch_sha}); this run uses ${WORKFLOW_SHA}. Select ${DEFAULT_BRANCH} in Run workflow and retry."
            exit 1
          fi

          source_is_allowed=false
          if git merge-base --is-ancestor "${package_source_sha}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            source_is_allowed=true
          elif [ "${PUBLISH_PHASE}" = "publish_npm_only" ] && [ -n "${MEMOS_RELEASE_TAG}" ]; then
            # A paired weekly release may stage the local-plugin tag on a direct
            # metadata-only child of the MemOS Release commit. The automation
            # still comes from current main; only the package source is allowed
            # to use this narrowly validated child commit.
            paired_source_ref="refs/memos-paired-source/${MEMOS_RELEASE_TAG}"
            git fetch --force --no-tags origin \
              "refs/tags/${MEMOS_RELEASE_TAG}:${paired_source_ref}"
            memos_release_sha="$(git rev-parse "${paired_source_ref}^{commit}")"

            if [ "${package_source_sha}" = "${memos_release_sha}" ]; then
              source_is_allowed=true
            else
              commit_line="$(git rev-list --parents -n 1 "${package_source_sha}")"
              read -r commit_sha parent_sha extra_parent <<< "${commit_line}"
              if [ "${commit_sha}" != "${package_source_sha}" ] || \
                 [ -z "${parent_sha:-}" ] || \
                 [ -n "${extra_parent:-}" ] || \
                 [ "${parent_sha}" != "${memos_release_sha}" ]; then
                echo "::error::Paired local-plugin source ${package_source_sha} must equal ${MEMOS_RELEASE_TAG} (${memos_release_sha}) or be its direct single-parent metadata child."
                exit 1
              fi

              unexpected_file=""
              while IFS= read -r changed_file; do
                case "${changed_file}" in
                  apps/memos-local-plugin/package.json|\
                  apps/memos-local-plugin/package-lock.json|\
                  apps/memos-local-plugin/adapters/hermes/plugin.yaml)
                    ;;
                  *)
                    unexpected_file="${changed_file}"
                    break
                    ;;
                esac
              done < <(git diff-tree --no-commit-id --name-only -r "${package_source_sha}")

              if [ -n "${unexpected_file}" ]; then
                echo "::error::Paired local-plugin metadata commit changes forbidden file: ${unexpected_file}"
                exit 1
              fi
              source_is_allowed=true
            fi
          fi

          if [ "${source_is_allowed}" != "true" ]; then
            echo "::error::Formal publish source ${package_source_sha} is not in ${DEFAULT_BRANCH} history and is not a valid paired local-plugin metadata source. Merge it before publishing."
            exit 1
          fi

      - name: Configure npm authentication preflight
        if: ${{ inputs.dry_run != true && (inputs.publish_phase || 'full') != 'stage_release' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate npm authentication before platform builds
        if: ${{ inputs.dry_run != true && (inputs.publish_phase || 'full') != 'stage_release' }}
        shell: bash
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is missing; stopping before platform builds."
            exit 1
          fi
          auth_log="${RUNNER_TEMP}/memos-local-plugin-npm-auth-preflight.log"
          set +e
          npm whoami \
            --registry=https://registry.npmjs.org \
            --fetch-retries=0 \
            --fetch-timeout=8000 \
            >"${auth_log}" 2>&1
          auth_status=$?
          set -e
          if [ "${auth_status}" != 0 ]; then
            sed -n '1,80p' "${auth_log}"
            echo "::error::NPM_TOKEN authentication failed; stopping before platform builds."
            exit 1
          fi
          echo "npm authentication preflight passed for $(tr -d '[:space:]' <"${auth_log}")."

  build-prebuilds:
    needs: guard-legacy-publish
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard-legacy-publish.outputs.package_source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted release automation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Use trusted release automation scripts
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf .github/scripts
          mkdir -p .github
          cp -R .release-workflow/.github/scripts .github/scripts
          rm -rf .release-workflow
          echo "Package source ref: $(git rev-parse --short HEAD)"
          echo "Release automation ref: ${{ github.workflow_sha }}"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: bash ../../.github/scripts/retry.sh --label "npm ci" -- npm ci

      - name: Rebuild for x64 under Rosetta (darwin-x64 only)
        if: matrix.platform == 'darwin-x64'
        shell: bash
        run: bash ../../.github/scripts/retry.sh --label "npm rebuild better-sqlite3 under Rosetta" -- arch -x86_64 npm rebuild better-sqlite3

      - name: Collect prebuild
        shell: bash
        run: |
          bash ../../.github/scripts/retry.sh --label "collect ${{ matrix.platform }} prebuild" -- bash -euo pipefail -c '
            mkdir -p prebuilds/${{ matrix.platform }}
            cp node_modules/better-sqlite3/build/Release/better_sqlite3.node prebuilds/${{ matrix.platform }}/
          '

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-${{ matrix.platform }}
          path: apps/memos-local-plugin/prebuilds/${{ matrix.platform }}/better_sqlite3.node

  publish:
    needs:
      - guard-legacy-publish
      - build-prebuilds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      local_plugin_tag: ${{ steps.release_tag.outputs.tag }}
      local_plugin_tag_sha: ${{ steps.release_tag.outputs.tag_sha }}
      package_source_sha: ${{ needs.guard-legacy-publish.outputs.package_source_sha }}
      local_plugin_release_url: ${{ steps.plugin_release.outputs.release_url }}
      local_plugin_release_is_draft: ${{ steps.plugin_release.outputs.release_is_draft }}
      local_plugin_evidence_digest: ${{ steps.plugin_release.outputs.evidence_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard-legacy-publish.outputs.package_source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted release automation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Use trusted release automation scripts
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf .github/scripts
          mkdir -p .github
          cp -R .release-workflow/.github/scripts .github/scripts
          rm -rf .release-workflow
          echo "Package source ref: $(git rev-parse --short HEAD)"
          echo "Release automation ref: ${{ github.workflow_sha }}"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Test npm publish helper
        working-directory: .
        run: |
          node --test \
            .github/scripts/publish-local-plugin.test.mjs \
            .github/scripts/wait-for-local-plugin-npm-release.test.mjs \
            .github/scripts/inspect-local-plugin-release-state.test.mjs \
            .github/scripts/audit-local-plugin-package.test.mjs \
            .github/scripts/draft-local-plugin-release-notes.test.mjs \
            .github/scripts/local-plugin-release-contract.test.mjs \
            .github/scripts/create-local-plugin-github-release.test.mjs

      - name: Download all prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: apps/memos-local-plugin/prebuilds
          pattern: prebuild-*
          merge-multiple: false

      - name: Organize prebuilds
        run: |
          bash ../../.github/scripts/retry.sh --label "organize prebuild artifacts" -- bash -euo pipefail -c '
            cd prebuilds
            for dir in prebuild-*; do
              platform="${dir#prebuild-}"
              mkdir -p "$platform"
              mv "$dir/better_sqlite3.node" "$platform/"
              rmdir "$dir"
            done
            echo "Prebuilds collected:"
            find . -name "*.node" -exec ls -lh {} \;
          '

      - name: Install dependencies (skip native build)
        run: bash ../../.github/scripts/retry.sh --label "npm ci --ignore-scripts" -- npm ci --ignore-scripts

      - name: Install Linux sqlite binding for validation
        run: |
          bash ../../.github/scripts/retry.sh --label "install linux sqlite binding for validation" -- bash -euo pipefail -c '
            test -s prebuilds/linux-x64/better_sqlite3.node
            mkdir -p node_modules/better-sqlite3/build/Release
            cp prebuilds/linux-x64/better_sqlite3.node node_modules/better-sqlite3/build/Release/better_sqlite3.node
          '

      - name: Generate telemetry credentials for a real publish
        if: ${{ inputs.dry_run != true && (inputs.publish_phase || 'full') != 'stage_release' }}
        run: bash ../../.github/scripts/retry.sh --label "generate telemetry credentials" -- node scripts/generate-telemetry-credentials.cjs
        env:
          MEMOS_ARMS_ENDPOINT: ${{ secrets.MEMOS_ARMS_ENDPOINT }}
          MEMOS_ARMS_PID: ${{ secrets.MEMOS_ARMS_PID }}
          MEMOS_ARMS_ENV: ${{ secrets.MEMOS_ARMS_ENV }}

      - name: Bump version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${RELEASE_VERSION}" == v* ]]; then
            echo "::error::version must not include a leading v."
            exit 1
          fi
          bash ../../.github/scripts/retry.sh --label "bump package version" -- npm version "${RELEASE_VERSION}" --no-git-tag-version --allow-same-version
          npm run sync:hermes-version
          npm run check:hermes-version

      - name: Validate and build package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash ../../.github/scripts/retry.sh --attempts 2 --label "npm run release:validate" -- npm run release:validate
          release_dir="${RUNNER_TEMP}/memos-local-plugin-release"
          pack_json="${RUNNER_TEMP}/memos-local-plugin-pack.json"
          mkdir -p "${release_dir}"
          bash ../../.github/scripts/retry.sh --label "npm pack" -- \
            bash -euo pipefail -c 'npm pack --json --silent --pack-destination "$1" > "$2"' \
            _ "${release_dir}" "${pack_json}"

          pack_filename="$(
            node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync(process.argv[1], "utf8");
              const jsonStart = raw.match(/^\[/m);
              if (!jsonStart || jsonStart.index === undefined) {
                throw new Error("npm pack output did not contain a JSON report");
              }
              const report = JSON.parse(raw.slice(jsonStart.index));
              if (!Array.isArray(report) || report.length !== 1 || !report[0].filename) {
                throw new Error("npm pack did not report exactly one tarball");
              }
              fs.writeFileSync(process.argv[1], `${JSON.stringify(report, null, 2)}\n`);
              process.stdout.write(report[0].filename);
            ' "${pack_json}"
          )"
          release_tarball="${release_dir}/${pack_filename}"
          test -s "${release_tarball}"

          package_version="$(
            tar -xOf "${release_tarball}" package/package.json \
              | node -e '
                  const fs = require("node:fs");
                  process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).version);
                '
          )"
          manifest_version="$(
            tar -xOf "${release_tarball}" package/adapters/hermes/plugin.yaml \
              | awk '$1 == "version:" { print $2; exit }'
          )"
          if [ "${package_version}" != "${RELEASE_VERSION}" ]; then
            echo "::error::Tarball package.json version ${package_version} does not match ${RELEASE_VERSION}."
            exit 1
          fi
          if [ "${manifest_version}" != "${RELEASE_VERSION}" ]; then
            echo "::error::Tarball Hermes manifest version ${manifest_version} does not match ${RELEASE_VERSION}."
            exit 1
          fi

          sha256sum "${release_tarball}" > "${release_tarball}.sha256"
          package_audit_report="${RUNNER_TEMP}/memos-local-plugin-package-audit.json"
          RELEASE_TARBALL="${release_tarball}" \
            PACKAGE_AUDIT_REPORT="${package_audit_report}" \
            node ../../.github/scripts/audit-local-plugin-package.mjs
          {
            echo "RELEASE_TARBALL=${release_tarball}"
            echo "RELEASE_TARBALL_SHA256=${release_tarball}.sha256"
            echo "PACKAGE_AUDIT_REPORT=${package_audit_report}"
          } >> "${GITHUB_ENV}"

      - name: Prepare standalone package inspection notes
        id: release_notes
        working-directory: .
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: memos-local-plugin-v${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
          RELEASE_EVIDENCE_REF: ${{ needs.guard-legacy-publish.outputs.package_source_sha }}
          MANUAL_RELEASE_NOTES: ${{ inputs.release_notes }}
          FORCE_PACKAGE_ONLY_RELEASE: ${{ inputs.tag != 'latest' || contains(inputs.version, '-') }}
          DOCS_SYNC_MODE: ${{ inputs.docs_sync_mode }}
          DOC_AGENT_RELEASE_NOTES_DRAFT_URL: ${{ (inputs.tag == 'latest' && !contains(inputs.version, '-')) && secrets.DOC_AGENT_RELEASE_NOTES_DRAFT_URL || '' }}
          DOC_AGENT_RELEASE_FAILURE_URL: ${{ (inputs.tag == 'latest' && !contains(inputs.version, '-')) && secrets.DOC_AGENT_RELEASE_FAILURE_URL || '' }}
          DOC_AGENT_RELEASE_NOTES_DRAFT_TOKEN: ${{ (inputs.tag == 'latest' && !contains(inputs.version, '-')) && secrets.DOC_AGENT_RELEASE_NOTES_DRAFT_TOKEN || '' }}
        run: node .github/scripts/draft-local-plugin-release-notes.mjs

      - name: Upload failed release notes diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memos-local-plugin-release-notes-failure
          path: ${{ runner.temp }}/memos-local-plugin-release-notes-failure
          if-no-files-found: ignore

      - name: Prepare release notes inspection artifact
        working-directory: .
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.release_notes.outputs.release_notes_file }}
          EVIDENCE_FILE: ${{ steps.release_notes.outputs.evidence_file }}
          DRAFT_FILE: ${{ steps.release_notes.outputs.draft_file }}
          DRAFT_USED: ${{ steps.release_notes.outputs.draft_used }}
          PREVIOUS_TAG: ${{ steps.release_notes.outputs.previous_tag }}
          CURRENT_TAG: ${{ steps.release_notes.outputs.current_tag }}
          CURRENT_REF: ${{ steps.release_notes.outputs.current_ref }}
          DRAFT_CONFIDENCE: ${{ steps.release_notes.outputs.draft_confidence }}
          MISSING_REQUIRED_COUNT: ${{ steps.release_notes.outputs.missing_required_count }}
          VALIDATION_ATTEMPT_COUNT: ${{ steps.release_notes.outputs.validation_attempt_count }}
          REPAIR_ATTEMPT_COUNT: ${{ steps.release_notes.outputs.repair_attempt_count }}
          NPM_DIST_TAG: ${{ inputs.tag }}
          DOCS_SYNC_MODE: ${{ inputs.docs_sync_mode }}
        run: |
          set -euo pipefail
          inspection_dir="${RUNNER_TEMP}/memos-local-plugin-release-notes-inspection"
          mkdir -p "${inspection_dir}"

          if [ -z "${RELEASE_NOTES_FILE}" ] || [ ! -s "${RELEASE_NOTES_FILE}" ]; then
            echo "::error::Release notes file was not generated."
            exit 1
          fi

          cp "${RELEASE_NOTES_FILE}" "${inspection_dir}/release-notes.md"
          cp "${RUNNER_TEMP}/memos-local-plugin-pack.json" "${inspection_dir}/npm-pack.json"
          cp "${RELEASE_TARBALL_SHA256}" "${inspection_dir}/"
          cp "${PACKAGE_AUDIT_REPORT}" "${inspection_dir}/package-audit.json"
          if [ -z "${EVIDENCE_FILE}" ] || [ ! -s "${EVIDENCE_FILE}" ]; then
            echo "::error::Evidence JSON file was not generated."
            exit 1
          fi
          if [ -z "${DRAFT_FILE}" ] || [ ! -s "${DRAFT_FILE}" ]; then
            echo "::error::Draft JSON file was not generated."
            exit 1
          fi
          cp "${EVIDENCE_FILE}" "${inspection_dir}/evidence.json"
          cp "${DRAFT_FILE}" "${inspection_dir}/release-notes-draft.json"

          if [ "${DOCS_SYNC_MODE}" = "paired_with_memos_release" ]; then
            docs_action="publish_paired_local_plugin_release"
            docs_summary="The weekly workflow creates a paired local-plugin Release. Its release.published event is the only Plugin tab and pre/gray trigger."
          elif [ "${NPM_DIST_TAG}" = "latest" ] && [[ "${RELEASE_VERSION}" != *-* ]]; then
            docs_action="publish_standalone_local_plugin_release"
            docs_summary="After npm and tag verification, the stable local-plugin GitHub Release triggers 106, the Plugin tab, and pre/gray."
          else
            docs_action="skip_prerelease_docs"
            docs_summary="Prerelease packages create npm, tag, inspection artifacts, and an independent GitHub Prerelease; they do not update the Plugin tab or deployment chain."
          fi

          jq \
            --arg schema "memos.local-plugin.quality-report.v1" \
            --arg version "v${RELEASE_VERSION}" \
            --arg docs_action "${docs_action}" \
            '{
              schema: $schema,
              version: $version,
              docs_action: $docs_action,
              ok: (.ok == true),
              needs_review: (.needs_review == true),
              confidence: (.confidence // ""),
              item_count: ((.release_items // []) | length),
              coverage: (.coverage // {}),
              language_issues: (.language_issues // []),
              validation_report: (.validation_report // {}),
              validation_attempt_count: (.validation_attempt_count // 0),
              repair_attempt_count: (.repair_attempt_count // 0)
            }' "${DRAFT_FILE}" > "${inspection_dir}/quality-report.json"

          jq \
            --arg schema "memos.local-plugin.docs-preview.v1" \
            --arg version "v${RELEASE_VERSION}" \
            --arg docs_action "${docs_action}" \
            --arg summary "${docs_summary}" \
            '{
              schema: $schema,
              version: $version,
              docs_action: $docs_action,
              would_create_independent_plugin_release: true,
              summary: $summary,
              release_items: (.release_items // [])
            }' "${DRAFT_FILE}" > "${inspection_dir}/docs-preview.json"

          {
            echo "# MemOS Local Plugin docs preview"
            echo
            echo "- version: v${RELEASE_VERSION}"
            echo "- action: ${docs_action}"
            echo "- independent local-plugin GitHub Release: true"
            echo
            echo "${docs_summary}"
            if [ "${docs_action}" != "skip_prerelease_docs" ]; then
              echo
              sed '/<!-- doc-agent-release-notes-json/,$d' "${RELEASE_NOTES_FILE}"
            fi
          } > "${inspection_dir}/docs-preview.md"

          {
            echo "# MemOS local plugin release notes inspection"
            echo
            echo "- dry_run: ${DRY_RUN}"
            echo "- version: ${RELEASE_VERSION}"
            echo "- draft_used: ${DRAFT_USED:-unknown}"
            echo "- previous_tag: ${PREVIOUS_TAG:-n/a}"
            echo "- current_tag: ${CURRENT_TAG:-n/a}"
            echo "- current_ref: ${CURRENT_REF:-n/a}"
            echo "- draft_confidence: ${DRAFT_CONFIDENCE:-n/a}"
            echo "- missing_required_count: ${MISSING_REQUIRED_COUNT:-n/a}"
            echo "- validation_attempt_count: ${VALIDATION_ATTEMPT_COUNT:-n/a}"
            echo "- repair_attempt_count: ${REPAIR_ATTEMPT_COUNT:-n/a}"
            echo
            echo "Files:"
            echo
            echo "- release-notes.md"
            echo "- npm-pack.json"
            echo "- package-audit.json"
            echo "- $(basename "${RELEASE_TARBALL_SHA256}")"
            echo "- The tarball is intentionally not uploaded because real publish builds embed public telemetry configuration."
            echo "- evidence.json (redacted; no full diff or prompt guidance)"
            echo "- docs-preview.md"
            echo "- docs-preview.json"
            echo "- quality-report.json"
            echo "- release-notes-draft.json"
          } > "${inspection_dir}/README.md"

          {
            echo "### MemOS local plugin release notes"
            echo
            echo "- dry_run: \`${DRY_RUN}\`"
            echo "- draft_used: \`${DRAFT_USED:-unknown}\`"
            echo "- previous_tag: \`${PREVIOUS_TAG:-n/a}\`"
            echo "- current_tag: \`${CURRENT_TAG:-n/a}\`"
            echo "- current_ref: \`${CURRENT_REF:-n/a}\`"
            echo "- draft_confidence: \`${DRAFT_CONFIDENCE:-n/a}\`"
            echo "- missing_required_count: \`${MISSING_REQUIRED_COUNT:-n/a}\`"
            echo "- validation_attempt_count: \`${VALIDATION_ATTEMPT_COUNT:-n/a}\`"
            echo "- repair_attempt_count: \`${REPAIR_ATTEMPT_COUNT:-n/a}\`"
            echo
            echo "Download the workflow artifact \`memos-local-plugin-release-notes-inspection\` to review release-notes.md, release-notes-draft.json, and redacted evidence.json."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release notes inspection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memos-local-plugin-release-notes-inspection
          path: ${{ runner.temp }}/memos-local-plugin-release-notes-inspection
          if-no-files-found: error

      - name: Stop before publish in dry run
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice::dry_run=true; skipped npm publish, tag creation, and independent local-plugin GitHub Release creation."

      - name: Inspect existing standalone package tag state
        id: release_state
        if: ${{ inputs.dry_run != true }}
        working-directory: .
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: memos-local-plugin-v${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
          EXPECTED_PACKAGE_SOURCE_SHA: ${{ needs.guard-legacy-publish.outputs.package_source_sha }}
        run: node .github/scripts/inspect-local-plugin-release-state.mjs

      - name: Require staged local-plugin metadata before npm-only publish
        if: ${{ inputs.dry_run != true && (inputs.publish_phase || 'full') == 'publish_npm_only' }}
        env:
          RELEASE_METADATA_STATE: ${{ steps.release_state.outputs.state }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_METADATA_STATE}" != "complete" ]; then
            echo "::error::publish_phase=publish_npm_only requires an existing, validated memos-local-plugin tag created by the staged paired Release step."
            exit 1
          fi

      - name: Publish to npm
        if: ${{ inputs.dry_run != true && (inputs.publish_phase || 'full') != 'stage_release' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: "@memtensor/memos-local-plugin"
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: memos-local-plugin-v${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
          RECOVER_EXISTING_NPM_RELEASE: ${{ inputs.recover_existing_npm_release }}
          RELEASE_METADATA_STATE: ${{ steps.release_state.outputs.state }}
          NPM_VISIBILITY_TIMEOUT_SECONDS: "150"
          NPM_VISIBILITY_INTERVAL_SECONDS: "10"
          NPM_VISIBILITY_REQUEST_TIMEOUT_SECONDS: "8"
          ALLOW_STAGED_TAG_BEFORE_NPM: ${{ (inputs.publish_phase || 'full') == 'publish_npm_only' && 'true' || 'false' }}
        run: bash ../../.github/scripts/publish-local-plugin.sh

      - name: Create standalone package tag
        id: release_tag
        if: ${{ inputs.dry_run != true && (inputs.publish_phase || 'full') != 'publish_npm_only' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: memos-local-plugin-v${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
          RELEASE_METADATA_STATE: ${{ steps.release_state.outputs.state }}
          EXPECTED_PACKAGE_SOURCE_SHA: ${{ needs.guard-legacy-publish.outputs.package_source_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          release_tag="memos-local-plugin-v${RELEASE_VERSION}"
          release_commit_message="release: @memtensor/memos-local-plugin v${RELEASE_VERSION}"
          remote_tag_exists() {
            local tag="$1"
            for attempt in 1 2 3; do
              set +e
              git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1
              status=$?
              set -e
              if [ "${status}" = 0 ]; then
                return 0
              fi
              if [ "${status}" = 2 ]; then
                return 1
              fi
              if [ "${attempt}" = 3 ]; then
                echo "::error::Failed to check remote tag ${tag} after three attempts."
                exit "${status}"
              fi
              sleep "$((attempt * 5))"
            done
          }
          if [ "${RELEASE_METADATA_STATE}" = "complete" ]; then
            echo "The standalone package tag was already validated; no tag metadata will be recreated."
            echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
            echo "tag_sha=${{ steps.release_state.outputs.tag_commit }}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git add \
            apps/memos-local-plugin/package.json \
            apps/memos-local-plugin/package-lock.json \
            apps/memos-local-plugin/adapters/hermes/plugin.yaml
          if ! git diff --staged --quiet; then
            git commit -m "${release_commit_message}"
          fi

          if remote_tag_exists "${release_tag}"; then
            echo "::error::Tag ${release_tag} appeared after preflight. Stop and rerun so its target can be validated."
            exit 1
          else
            git tag "${release_tag}"
            bash .github/scripts/retry.sh --label "push release tag" -- git push origin "refs/tags/${release_tag}"
          fi

          tag_sha="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "tag_sha=${tag_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create and verify independent local-plugin GitHub Release
        id: plugin_release
        if: ${{ inputs.dry_run != true && (inputs.publish_phase || 'full') != 'publish_npm_only' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          RELEASE_TAG_SHA: ${{ steps.release_tag.outputs.tag_sha }}
          RELEASE_NOTES_FILE: ${{ steps.release_notes.outputs.release_notes_file }}
          EVIDENCE_FILE: ${{ steps.release_notes.outputs.evidence_file }}
          RELEASE_ORIGIN_MODE: ${{ inputs.docs_sync_mode == 'paired_with_memos_release' && 'memos_weekly' || 'standalone' }}
          MEMOS_RELEASE_TAG: ${{ inputs.docs_sync_mode == 'paired_with_memos_release' && inputs.memos_release_tag || '' }}
          CREATE_DRAFT_RELEASE: ${{ inputs.docs_sync_mode == 'paired_with_memos_release' && inputs.create_draft_release || false }}
          OUTPUT_RELEASE_BODY_FILE: ${{ runner.temp }}/memos-local-plugin-release-body.md
        run: node .github/scripts/create-local-plugin-github-release.mjs
