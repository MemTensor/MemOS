name: MemOS Release — Publish Paired Local Plugin

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      memos_release_tag:
        description: "Recovery only: published MemOS v* Release whose paired local-plugin Draft should be verified and published"
        required: true
        type: string
      recovery_confirmation:
        description: "Must exactly equal: PUBLISH PAIRED LOCAL PLUGIN FOR <memos_release_tag>"
        required: true
        type: string

concurrency:
  group: memos-paired-local-plugin-${{ github.event.release.tag_name || inputs.memos_release_tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-paired-local-plugin:
    if: >-
      ${{
        github.repository == 'MemTensor/MemOS' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            startsWith(github.event.release.tag_name, 'v') &&
            github.event.release.prerelease == false
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.resolve.outputs.status }}
      memos_release_tag: ${{ steps.resolve.outputs.memos_release_tag }}
      memos_release_version: ${{ steps.resolve.outputs.memos_release_version }}
      local_plugin_tag: ${{ steps.resolve.outputs.local_plugin_tag }}
      local_plugin_version: ${{ steps.resolve.outputs.local_plugin_version }}
      local_plugin_source_sha: ${{ steps.resolve.outputs.local_plugin_source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate explicit recovery confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          MEMOS_RELEASE_TAG: ${{ inputs.memos_release_tag }}
          RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
        run: |
          set -euo pipefail
          expected="PUBLISH PAIRED LOCAL PLUGIN FOR ${MEMOS_RELEASE_TAG}"
          if [ "${RECOVERY_CONFIRMATION}" != "${expected}" ]; then
            echo "::error::recovery_confirmation must exactly equal: ${expected}"
            exit 1
          fi

      - name: Test paired-release contract
        run: |
          node --test \
            .github/scripts/append-local-plugin-release-intent.test.mjs \
            .github/scripts/local-plugin-release-contract.test.mjs \
            .github/scripts/publish-paired-local-plugin-release.test.mjs

      - name: Verify paired local-plugin Draft binding
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          MEMOS_RELEASE_TAG_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.memos_release_tag || '' }}
          VALIDATE_ONLY: "true"
        run: node .github/scripts/publish-paired-local-plugin-release.mjs

      - name: Summarize paired resolve
        env:
          STATUS: ${{ steps.resolve.outputs.status }}
          MEMOS_RELEASE_TAG: ${{ steps.resolve.outputs.memos_release_tag }}
          LOCAL_PLUGIN_TAG: ${{ steps.resolve.outputs.local_plugin_tag }}
        run: |
          {
            echo "## Paired local-plugin Release"
            echo
            echo "- status: ${STATUS}"
            echo "- MemOS Release: ${MEMOS_RELEASE_TAG}"
            echo "- local-plugin Release: ${LOCAL_PLUGIN_TAG:-not requested}"
            echo
            echo "A stable local-plugin Release publishes only after its binding matches the published MemOS Release and npm publish succeeds. Its release.published webhook is the only local-plugin docs trigger."
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-local-plugin-npm:
    needs: resolve-paired-local-plugin
    if: ${{ needs.resolve-paired-local-plugin.outputs.status == 'staged' }}
    permissions:
      contents: write
    uses: ./.github/workflows/memos-local-plugin-publish.yml
    with:
      version: ${{ needs.resolve-paired-local-plugin.outputs.local_plugin_version }}
      tag: latest
      git_ref: ${{ needs.resolve-paired-local-plugin.outputs.local_plugin_source_sha }}
      release_notes: ""
      dry_run: false
      recover_existing_npm_release: true
      docs_sync_mode: paired_with_memos_release
      memos_release_version: ${{ needs.resolve-paired-local-plugin.outputs.memos_release_version }}
      memos_release_tag: ${{ needs.resolve-paired-local-plugin.outputs.memos_release_tag }}
      publish_phase: publish_npm_only
      auto_post_merge_release: true
      create_draft_release: true
      caller_publish_confirmation: ""
    secrets: inherit

  publish-paired-local-plugin:
    needs:
      - resolve-paired-local-plugin
      - publish-local-plugin-npm
    if: >-
      ${{
        needs.resolve-paired-local-plugin.outputs.status == 'staged' &&
        needs.publish-local-plugin-npm.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify and publish paired local-plugin Draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MEMOS_RELEASE_TAG_OVERRIDE: ${{ needs.resolve-paired-local-plugin.outputs.memos_release_tag }}
        run: node .github/scripts/publish-paired-local-plugin-release.mjs

      - name: Summarize paired publish
        env:
          STATUS: ${{ steps.publish.outputs.status }}
          MEMOS_RELEASE_TAG: ${{ steps.publish.outputs.memos_release_tag }}
          LOCAL_PLUGIN_TAG: ${{ steps.publish.outputs.local_plugin_tag }}
        run: |
          {
            echo "## Paired local-plugin Release"
            echo
            echo "- status: ${STATUS}"
            echo "- MemOS Release: ${MEMOS_RELEASE_TAG}"
            echo "- local-plugin Release: ${LOCAL_PLUGIN_TAG}"
            echo
            echo "npm was verified before the local-plugin Draft was published."
          } >> "${GITHUB_STEP_SUMMARY}"
