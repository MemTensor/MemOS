# 本地部署：MemOS 服务 + PostgreSQL(pgvector)，项目记忆与核心共用一个 Postgres。
#
#   1) 生成 .env（从 MemOS_DEV/env_example 取模型 key，只取模型那几项）
#        python3 docker/project-memory/make_env.py --env-file ../env_example
#   2) 构建基础镜像（仓库自带的 Dockerfile）+ 部署镜像
#        docker build -f docker/Dockerfile -t memos-base:promem .
#   3) 起服务
#        docker compose -f docker/project-memory/docker-compose.yml up -d --build
#   4) 冒烟（本机跑；整理是异步的，脚本会轮询 get/status）
#        python3 docker/project-memory/smoke.py --base http://127.0.0.1:8000
#   5) 看日志 / 停（数据在命名卷里，down 不删）
#        docker compose -f docker/project-memory/docker-compose.yml logs -f memos
#        docker compose -f docker/project-memory/docker-compose.yml down
#
# 为什么是 Postgres：三个后端里它最轻——只要标准 Postgres + pgvector 一个扩展；
# Neo4j 要多一个 Java 进程、社区版配置里还写死要 Qdrant；PolarDB 要 polar_age 图引擎 + 中文分词。
# 项目记忆默认跟核心用同一个 Postgres（不同 schema），少一套配置。

name: memos-project-memory

services:
  memos:
    container_name: memos-promem
    build:
      context: ../..
      dockerfile: docker/project-memory/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../.memos:/app/.memos
    networks:
      - memos_network
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: memos-promem-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: memos
      POSTGRES_PASSWORD: projectmemory
      POSTGRES_DB: memos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memos -d memos"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - memos_network

volumes:
  pg_data:

networks:
  memos_network:
    driver: bridge
